# ──────────────────────────────────────────────────────────────────────────────
# CI Workflow — Runs on every push and pull request to main
#
# Jobs:
#   1. backend-tests  — Installs Python deps, runs pytest, reports coverage
#   2. frontend-build — Installs Node deps, lints, builds production bundle
#
# Both jobs must pass before a PR can be merged.
# ──────────────────────────────────────────────────────────────────────────────

name: CI — Test & Build

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Python Backend Tests
  # ────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      - name: Create test environment file
        # Provides stub env variables so the app can import without real keys
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=https://test.supabase.co
          SUPABASE_SERVICE_KEY=test-service-key
          SUPABASE_JWT_SECRET=test-jwt-secret-at-least-32-characters-long
          GROQ_API_KEY=test-groq-key
          GROQ_MODEL=qwen/qwen3.8-27b
          OPENROUTER_API_KEY=test-openrouter-key
          OPENROUTER_MODEL=qwen/qwen-2.5-72b-instruct
          EOF

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --ignore=tests/sample_pdfs \
            -k "not test_parallel_extraction_on_large_document"
        # Note: The 114-page parallel extraction test is skipped in CI
        # (too slow for CI runners). It runs in the nightly workflow instead.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: React Frontend Build
  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Create frontend environment file
        working-directory: frontend
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=https://placeholder.onrender.com
          VITE_SUPABASE_URL=https://test.supabase.co
          VITE_SUPABASE_ANON_KEY=test-anon-key
          EOF

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
