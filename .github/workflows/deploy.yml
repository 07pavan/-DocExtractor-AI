# ──────────────────────────────────────────────────────────────────────────────
# CD Workflow — Deploys to Render (backend) and Vercel (frontend)
#
# Triggers ONLY on push to main branch (after CI passes).
#
# Required GitHub Secrets (set in repo Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  — Render webhook URL for backend service
#   VERCEL_TOKEN            — Vercel personal access token
#   VERCEL_ORG_ID           — Vercel team/org ID (from vercel link)
#   VERCEL_PROJECT_ID       — Vercel project ID (from vercel link)
#   VITE_API_URL            — Full URL of deployed backend, e.g.
#                             https://docextractor-api.onrender.com
#   VITE_SUPABASE_URL       — Your Supabase project URL
#   VITE_SUPABASE_ANON_KEY  — Your Supabase anon/public key
# ──────────────────────────────────────────────────────────────────────────────

name: CD — Deploy to Render & Vercel

on:
  push:
    branches: ["main"]

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# Ensures only one deploy runs at a time (cancels in-progress on new push)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Run CI first — do not deploy if tests or build fail
  # ────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: ✅ CI Gate (tests must pass)
    uses: ./.github/workflows/ci.yml

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Deploy FastAPI Backend → Render
  # ────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: ci-gate   # Only deploy after tests pass

    steps:
      - name: Trigger Render deploy hook
        # Render provides a unique deploy hook URL per service.
        # Calling it with POST triggers a new deployment immediately.
        run: |
          RESPONSE=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          echo "Render API response: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Render deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Render deploy triggered successfully"

      - name: Wait for Render deploy to complete
        # Poll the Render deploy status endpoint every 15 seconds for up to 5 minutes
        run: |
          echo "Waiting 30s for Render build to start..."
          sleep 30

          MAX_ATTEMPTS=18   # 18 × 15s = 270s = 4.5 minutes
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            STATUS_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "https://docextractor-api.onrender.com/health" 2>/dev/null || echo "000")

            if [ "$STATUS_CODE" = "200" ]; then
              echo "✅ Backend is live at https://docextractor-api.onrender.com"
              break
            fi

            echo "   Status: $STATUS_CODE — waiting 15s..."
            sleep 15
          done

          if [ "$STATUS_CODE" != "200" ]; then
            echo "⚠️ Backend health check timed out (may still be starting)"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy React Frontend → Vercel
  # ────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: ci-gate   # Only deploy after tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle with real env variables
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "✅ Frontend deployed to: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Post deployment URL to job summary
        run: |
          echo "## 🌐 Frontend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: ${{ env.DEPLOY_URL }}" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Notify deployment status
  # ────────────────────────────────────────────────────────────────────────────
  notify:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Render) | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel) | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
